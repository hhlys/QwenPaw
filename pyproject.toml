[project]
name = "hclaw"
version = "0.1.0"
description = "hClaw product launcher that composes the QwenPaw core library."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "qwenpaw==1.1.7",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["src"] } }

[project.scripts]
hclaw = "hclaw.app:cli"
